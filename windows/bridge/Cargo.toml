[package]
name = "ventapes-bridge"
version = "0.0.0"
edition = "2021"
description = "Native Windows bridge for the VenTapes learning fork - SMTC and launcher"

[[bin]]
name = "VenTapesBridge"
path = "src/bridge.rs"

[[bin]]
name = "VenTapes"
path = "src/launcher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
strip = true
lto = true
